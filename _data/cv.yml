- title: Profile
  type: text
  contents: >-
    I build machine learning systems from start to finish: the messy data and feature work up front,
    then training, validation, and getting models running on high-performance compute. I come at it
    from two angles: solid production Python on one side, and modeling instincts from a PhD in
    Scientific ML and a Master's in Applied Mathematics on the other. I write clean, well-tested code,
    and I care most about ML that's <strong>reliable and interpretable</strong> enough to actually ship,
    not just work once in a notebook.

