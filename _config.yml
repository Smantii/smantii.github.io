cv_pdf:
contact_note: I’m open to ML roles in Italy, on-site or hybrid. Mail, Discord or Telegram are the best ways to reach me.

# -----------------------------------------------------------------------------
# Content
# -----------------------------------------------------------------------------

collections:
  news:
    output: false

permalink: /blog/:year/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false

include: ["_pages"]
exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - requirements.txt
  - vendor/
  - node_modules/

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
  - jemoji

feed:
  path: /blog/feed.xml
  posts_limit: 20

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank

jekyll-minifier:
  exclude: ["robots.txt", "assets/css/*.css"] # the CSS minifier breaks calc() spacing
  uglifier_args:
    harmony: true

# Responsive images are not used by this theme.
imagemagick:
  enabled: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Scholar (publications)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Manti]
  first_name: [Simone, S.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: pub
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

# Fields used internally by the site, hidden from the copyable BibTeX.
filtered_bibtex_keywords:
  [abstract, arxiv, bibtex_show, code, html, pdf, preview, selected, venue, website]
